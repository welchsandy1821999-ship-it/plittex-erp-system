<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход - Плиттекс ERP</title>
    <style>
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            font-family: sans-serif;
            color: white;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: min(350px, calc(100vw - 32px));
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        #error-msg {
            color: #ef4444;
            margin-top: 15px;
            min-height: 20px;
            font-size: 14px;
        }
    </style>
    <script src="/js/api-url.js"></script>
    <script>
        (function () {
            const h = window.location.hostname;
            const isLocal = h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
            if (isLocal) return;
            const port = window.location.port;
            if (port === '3000' || port === '3001') {
                window.location.replace(`${window.location.protocol}//${h}/login.html`);
                return;
            }
            if (window.location.protocol === 'http:') {
                window.location.replace(`https://${h}${window.location.pathname}${window.location.search}`);
            }
        })();
    </script>
</head>

<body>
    <div class="login-box">
        <h2>ПЛИТТЕКС ERP</h2>
        <form id="login-form" autocomplete="on">
            <input type="text" id="username" name="username" placeholder="Логин" autocomplete="username" required>
            <input type="password" id="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
            <button type="submit" id="login-btn">Войти</button>
        </form>
        <div id="error-msg"></div>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();
            doLogin();
        });

        async function doLogin() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const err = document.getElementById('error-msg');

            if (!u || !p) {
                err.innerText = 'Введите логин и пароль';
                return;
            }

            err.innerText = 'Авторизация...';
            loginBtn.disabled = true;

            try {
                const loginUrl = typeof resolveApiUrl === 'function'
                    ? resolveApiUrl('/api/login')
                    : '/api/login';

                const res = await fetch(loginUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p }),
                    credentials: 'same-origin',
                    mode: 'cors',
                    cache: 'no-store'
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('jwtToken', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.replace('/');
                    return;
                }

                err.innerText = data.error || 'Ошибка входа';
            } catch (e) {
                err.innerText = 'Ошибка соединения с сервером';
                console.error('Login error:', e);
            } finally {
                loginBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
