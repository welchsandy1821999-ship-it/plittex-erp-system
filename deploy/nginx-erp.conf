# /etc/nginx/sites-available/erp.plittex.ru
# Шаг 1: скопировать на сервер и включить:
#   sudo cp nginx-erp.conf /etc/nginx/sites-available/erp.plittex.ru
#   sudo ln -s /etc/nginx/sites-available/erp.plittex.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Шаг 2: получить SSL-сертификат Let's Encrypt:
#   sudo certbot --nginx -d erp.plittex.ru
#
# Certbot автоматически добавит блоки ssl_certificate и редирект.

# === HTTP → HTTPS редирект (certbot обновит автоматически) ===
server {
    listen 80;
    listen [::]:80;
    server_name erp.plittex.ru;

    # Для проверки certbot (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Всё остальное → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# === HTTPS — основной блок (certbot заполнит ssl_certificate) ===
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.plittex.ru;

    # Certbot заполнит эти строки автоматически:
    # ssl_certificate /etc/letsencrypt/live/erp.plittex.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erp.plittex.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Лимиты для загрузки файлов (накладные, счета и т.д.)
    client_max_body_size 50M;

    # Проксирование на Node.js (порт 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
